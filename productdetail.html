<!DOCTYPE html>
<html lang="en" dir="ltr">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Product | Noor Abaya &amp; Hijab</title>
  <link rel="stylesheet" href="style.css">
  <link
    href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600&family=Noto+Naskh+Arabic:wght@400;700&family=Noto+Nastaliq+Urdu:wght@400;700&display=swap"
    rel="stylesheet">
</head>

<body>

  <!-- HEADER -->
  <header class="header">
    <div class="container nav-wrap">
      <a href="index.html#home" class="logo">
        <svg width="44" height="44" viewBox="0 0 44 44">
          <circle cx="22" cy="22" r="21" fill="#DDA15E" />
          <path d="M12 34V18a10 10 0 0 1 20 0v16" fill="none" stroke="#283618" stroke-width="3" />
          <circle cx="22" cy="13" r="2.5" fill="#283618" />
        </svg>
        <span data-i18n="brand">Noor Abaya &amp; Hijab</span>
      </a>

      <nav class="nav" id="nav">
        <a href="index.html#home" data-i18n="nav_home">Home</a>
        <a href="index.html#shop" data-i18n="nav_shop">Shop</a>
        <a href="index.html#about" data-i18n="nav_about">About Us</a>
        <a href="index.html#branches" data-i18n="nav_branches">Branches</a>
        <a href="index.html#cart">
          <span data-i18n="nav_cart">Cart</span>
          <span class="cart-count" id="cartCount">0</span>
        </a>
      </nav>

      <div class="controls">
        <select id="langSelect">
          <option value="en">English</option>
          <option value="ur">اردو</option>
          <option value="ar">العربية</option>
        </select>
        <button class="menu-btn" id="menuBtn">☰</button>
      </div>
    </div>
  </header>

  <main class="container">
    <!-- Country select is outside the dynamic part so it is not erased on redraw -->
    <div class="country-box reveal" style="margin-top:20px">
      <h3 data-i18n="choose_country">Choose Your Country</h3>
      <select id="countrySelect" class="country-select"></select>
    </div>

    <a href="index.html#shop" class="btn" data-i18n="back_shop">Back to Shop</a>

    <!-- Product details are drawn here by detail.js -->
    <div id="productBox"></div>
  </main>

  <footer>
    <p data-i18n="footer_text">© 2026 Noor Abaya & Hijab. All rights reserved.</p>
  </footer>

  <div class="toast" id="toast"></div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="supabase-config.js"></script>
  <script src="common.js"></script>
  <script src="detail.js"></script>
</body>

</html>
